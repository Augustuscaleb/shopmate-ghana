# Dependency update alerts (SEC-42)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Type definitions must match the Node.js version we run (22), not the newest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    # Expo SDK packages must move together; upgrade them deliberately with `npx expo install --fix`.
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react-native"
      - dependency-name: "react"
      # TypeScript version is pinned by the Expo SDK (SDK 58: ~6.0.3)
      - dependency-name: "typescript"
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
